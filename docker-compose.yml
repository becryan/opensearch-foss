services:
  opensearch-node: # This is also the hostname of the container within the Docker network (i.e. https://opensearch-node1/)
    image: opensearchproject/opensearch:2.18.0
    container_name: opensearch-node
    environment:
      - cluster.name=opensearch-cluster # Name the cluster
      - node.name=opensearch-node # Name the node that will run in this container
      - discovery.seed_hosts=opensearch-node # Nodes to look for when discovering the cluster
      - cluster.initial_cluster_manager_nodes=opensearch-node # Nodes eligibile to serve as cluster manager
      - bootstrap.memory_lock=true # Disable JVM heap memory swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # Set min and max JVM heap sizes to at least 50% of system RAM
      #- DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD} # Sets the demo admin user password when using demo configuration (for OpenSearch 2.12 and later)
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data # Creates volume called opensearch-data1 and mounts it to the container
    ports:
      - 9200:9200 # REST API
      - 9600:9600 # Performance Analyzer
    healthcheck:
      # Logstash waits on this, otherwise the first poll is lost to a refused connection
      test: ["CMD-SHELL", "curl -ks -u admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    networks:
      - opensearch-net # All of the containers will join the same Docker bridge network
  opensearch-dashboards:
    # Built from Dockerfile.dashboards, which patches the Maps plugin so a map
    # opens over south-east Australia instead of the whole world. Revert to the
    # plain image by swapping build: for image: on the line below.
    build:
      context: .
      dockerfile: Dockerfile.dashboards
    image: opensearch-foss/opensearch-dashboards:2.18.0-zoomed
    container_name: opensearch-dashboards
    depends_on:
      opensearch-node:
        condition: service_healthy
    ports:
      - 5601:5601 # Map host port 5601 to container port 5601
    expose:
      - "5601" # Expose port 5601 for web access to OpenSearch Dashboards
    volumes:
      # Sets opensearch.hosts and turns multi-tenancy off, so an imported
      # dashboard is visible in the UI rather than stranded in another tenant.
      - ./configs/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    networks:
      - opensearch-net

  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.4.0
    container_name: logstash
    depends_on:
      opensearch-node:
        condition: service_healthy
    environment:
      # Used by the opensearch output in pipeline/pipeline.conf so the password
      # is not committed in the pipeline file.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - PIPELINE_ECS_COMPATIBILITY=disabled
    volumes:
    - ./pipeline:/usr/share/logstash/pipeline
    - ./templates:/usr/share/logstash/templates
    - ./ruby:/usr/share/logstash/ruby
    networks:
    - opensearch-net
  #data-prepper:
  #  container_name: data-prepper
  #  image: docker.io/opensearchproject/data-prepper:latest
