# ===========================================================================
#  Ingesting multiple sources of satellite metadata into OpenSearch
#
#  Four live public catalogues, four different metadata shapes, one clean
#  index. The same area of interest (south-east Australia) and the same
#  time window is asked of every source, so the differences you see in
#  OpenSearch are differences in the METADATA, not in the query.
#
#  Shape of this file:
#    input   - one http_poller per catalogue, tagged with its source
#    filter  - explode the envelope, run that source's adapter, then normalise
#    output  - clean documents to satellite-metadata,
#              anything unusable to satellite-metadata-quarantine
# ===========================================================================

input {

  # --- 1. Geoscience Australia, DEA Explorer (STAC) ------------------------
  # Well-behaved STAC. This is the control group.
  http_poller {
    id => "poller-ga-dea"
    urls => {
      dea => {
        method  => get
        url     => "https://explorer.dea.ga.gov.au/stac/search?collections=ga_s2bm_ard_3&limit=100&bbox=141,-39,154,-28&datetime=2024-06-01T00:00:00Z/2024-06-30T23:59:59Z"
        headers => { "Accept" => "application/geo+json" }
      }
    }
    tags => ["src_dea", "stac"]
    codec => "json"
    request_timeout => 90
    socket_timeout => 90
    connect_timeout => 20
    automatic_retries => 2
    metadata_target => "http_poller_metadata"
    schedule => { every => "30m" }
  }

  # --- 2. Element 84 Earth Search (STAC) ----------------------------------
  # Also STAC, but a different processing chain and a different vocabulary of
  # properties for the same satellites.
  http_poller {
    id => "poller-earth-search"
    urls => {
      earthsearch => {
        method  => get
        url     => "https://earth-search.aws.element84.com/v1/search?collections=sentinel-2-l2a&limit=100&bbox=141,-39,154,-28&datetime=2024-06-01T00:00:00Z/2024-06-30T23:59:59Z"
        headers => { "Accept" => "application/geo+json" }
      }
    }
    tags => ["src_earthsearch", "stac"]
    codec => "json"
    request_timeout => 90
    socket_timeout => 90
    connect_timeout => 20
    automatic_retries => 2
    metadata_target => "http_poller_metadata"
    schedule => { every => "30m" }
  }

  # --- 3. NASA CMR, HLS Sentinel-2 AND HLS Landsat (not STAC) -------------
  # The messiest of the four shapes:
  #   - no platform field at all; the mission is only in free text
  #   - cloud cover arrives as a string
  #   - footprints are latitude-first space-separated numbers
  # Both HLS missions are asked for in one request (CMR treats a repeated
  # short_name as OR). Two separate pollers against the same host were
  # unreliable, and one request is kinder to a public API anyway.
  http_poller {
    id => "poller-nasa-cmr"
    urls => {
      cmr => {
        method  => get
        url     => "https://cmr.earthdata.nasa.gov/search/granules.json?short_name=HLSS30&short_name=HLSL30&page_size=200&bounding_box=141,-39,154,-28&temporal=2024-06-01T00:00:00Z,2024-06-30T23:59:59Z"
        headers => { "Accept" => "application/json" }
      }
    }
    tags => ["src_cmr"]
    codec => "json"
    request_timeout => 120
    socket_timeout => 120
    connect_timeout => 20
    automatic_retries => 2
    metadata_target => "http_poller_metadata"
    schedule => { every => "30m" }
  }

  # --- 5. OPTIONAL FIFTH ACT: whole-planet footprints ---------------------
  # Uncomment to add CMR *collection* records alongside the scene records.
  # Collection-level metadata describes a whole mission, so its footprint is a
  # bounding box over most of the Earth ("-84 -180 84 180"). Index that beside
  # real scenes and every spatial query matches it, which is one of the more
  # common ways an Earth observation catalogue quietly stops being useful.
  #
  # It also exercises the fourth geometry decoder (bbox-string) and the
  # antimeridian guard, so these records arrive carrying the ingest notes
  # geometry-widened-to-bbox and suspected-antimeridian-crossing.
  #
  # http_poller {
  #   id => "poller-cmr-collections"
  #   urls => {
  #     cmr_collections => {
  #       method  => get
  #       url     => "https://cmr.earthdata.nasa.gov/search/collections.json?keyword=sentinel&page_size=20"
  #       headers => { "Accept" => "application/json" }
  #     }
  #   }
  #   tags => ["src_cmr"]
  #   codec => "json"
  #   request_timeout => 90
  #   socket_timeout => 90
  #   connect_timeout => 20
  #   automatic_retries => 2
  #   metadata_target => "http_poller_metadata"
  #   schedule => { every => "30m" }
  # }

  # --- 4. Copernicus Data Space Ecosystem (OData) -------------------------
  # Not GeoJSON in any form: WKT footprints, nested ContentDate, mission only
  # in the filename, cloud cover buried in a name/value array.
  # $ is written as %24 so Logstash never mistakes it for a variable.
  http_poller {
    id => "poller-copernicus"
    urls => {
      copernicus => {
        method  => get
        url     => "https://catalogue.dataspace.copernicus.eu/odata/v1/Products?%24filter=Collection/Name%20eq%20%27SENTINEL-2%27%20and%20ContentDate/Start%20gt%202024-06-01T00:00:00.000Z%20and%20ContentDate/Start%20lt%202024-06-30T23:59:59.000Z%20and%20OData.CSC.Intersects(area=geography%27SRID=4326;POLYGON((141%20-39,154%20-39,154%20-28,141%20-28,141%20-39))%27)&%24top=100&%24expand=Attributes"
        headers => { "Accept" => "application/json" }
      }
    }
    tags => ["src_copernicus"]
    codec => "json"
    request_timeout => 120
    socket_timeout => 120
    connect_timeout => 20
    automatic_retries => 2
    metadata_target => "http_poller_metadata"
    schedule => { every => "30m" }
  }
}

filter {

  # -------------------------------------------------------------------------
  # STEP 1  Explode the response envelope into one event per scene.
  #         Each catalogue buries its list in a different place.
  # -------------------------------------------------------------------------
  if "stac" in [tags] and [features] {
    split { field => "features" }
  }
  if "src_cmr" in [tags] and [feed][entry] {
    split { field => "[feed][entry]" }
  }
  if "src_copernicus" in [tags] and [value] {
    split { field => "value" }
  }

  # -------------------------------------------------------------------------
  # STEP 2  Run the adapter for this source. Adapters only pluck values into
  #         [raw][...] staging fields - they never clean anything.
  # -------------------------------------------------------------------------
  if "src_dea" in [tags] {
    ruby {
      path => "/usr/share/logstash/ruby/adapter_stac.rb"
      script_params => { "source" => "ga-dea-stac" }
    }
  }
  if "src_earthsearch" in [tags] {
    ruby {
      path => "/usr/share/logstash/ruby/adapter_stac.rb"
      script_params => { "source" => "element84-earth-search" }
    }
  }
  if "src_cmr" in [tags] {
    ruby { path => "/usr/share/logstash/ruby/adapter_cmr.rb" }
  }
  if "src_copernicus" in [tags] {
    ruby { path => "/usr/share/logstash/ruby/adapter_copernicus.rb" }
  }

  # -------------------------------------------------------------------------
  # STEP 3  One normaliser for every source. This is where the mess is fixed:
  #         mission names, dates, cloud cover, and four geometry encodings.
  # -------------------------------------------------------------------------
  ruby { path => "/usr/share/logstash/ruby/normalise.rb" }

  # -------------------------------------------------------------------------
  # STEP 4  Drop the leftover envelope scaffolding so it never reaches the
  #         index and never contributes to a mapping conflict.
  # -------------------------------------------------------------------------
  mutate {
    remove_field => [
      "http_poller_metadata", "@version",
      "features", "feed", "value",
      "type", "stac_version", "stac_extensions", "context",
      "links", "numberMatched", "numberReturned",
      "@odata.context", "@odata.nextLink"
    ]
  }
}

output {
  opensearch {
    hosts    => ["https://opensearch-node:9200"]
    user     => "admin"
    password => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
    ssl_certificate_verification => false

    # satellite-metadata, or satellite-metadata-quarantine when the normaliser
    # could not produce a usable document. Decided in ruby/normalise.rb.
    index       => "%{[@metadata][target_index]}"
    document_id => "%{[@metadata][doc_id]}"

    ecs_compatibility => disabled

    # The mapping is installed by demo/setup.sh against the composable
    # _index_template API, so Logstash must not try to manage it as well.
    manage_template => false
  }

  # Uncomment while you are working on the adapters - it prints the normalised
  # document to the Logstash log so you can see exactly what would be indexed.
  # stdout { codec => rubydebug { metadata => true } }
}
